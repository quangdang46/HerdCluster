[package]
name = "herdcluster"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Distributed coding-agent cluster: Mac controller + remote workers, built on the herdr API"
repository = "https://github.com/quangdang46/HerdCluster"
keywords = ["agents", "orchestration", "cluster", "herdr", "ai"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
