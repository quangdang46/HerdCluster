[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/quangdang46/herd_cluster"
description = "Distributed coding-agent cluster: Mac controller + remote workers, built on the herdr API"

[profile.release]
strip = true

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

cluster-core = { path = "crates/cluster-core" }
cluster-net = { path = "crates/cluster-net" }
cluster-bridge = { path = "crates/cluster-bridge" }
cluster-fleet = { path = "crates/cluster-fleet" }
cluster-node = { path = "crates/cluster-node" }
api-client = { path = "crates/api-client" }
