[package]
name = "cluster-net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "HerdCluster cluster-net crate"

[dependencies]
cluster-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.54", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "sync",
    "io-util",
] }
tokio-rustls = "0.26"
rustls = { version = "0.23.46", default-features = false, features = [
    "std",
    "ring",
    "logging",
] }
rustls-pemfile = "2"
rcgen = "0.14"
time = "0.3"
mdns-sd = "0.21.7"
bytes = "1"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
