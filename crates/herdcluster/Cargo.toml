[package]
name = "herdcluster"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
keywords = ["agents", "orchestration", "cluster", "herdr", "ai"]
categories = ["command-line-utilities"]

[[bin]]
name = "herdcluster"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
ureq = "2"
tokio = { version = "1", features = ["full"] }
api-client.workspace = true
cluster-core.workspace = true
cluster-fleet.workspace = true
cluster-node.workspace = true
# cluster-net / cluster-bridge stay out of scope: herdcluster talks to the
# daemons through cluster-node's public API, never the wire internals.
