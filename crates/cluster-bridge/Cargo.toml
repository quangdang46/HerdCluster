[package]
name = "cluster-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "HerdCluster cluster-bridge crate"

[dependencies]
serde.workspace = true
serde_json.workspace = true
cluster-core.workspace = true
cluster-net.workspace = true
api-client.workspace = true
bytes = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1.54", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "sync",
    "io-util",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
